seed: 20261026
project_config: scripts/toolmaze_agent/configs/project.yaml
model: runs/sft_full/final
output: runs/grpo
dtype: bfloat16
freeze_vision: true
modes: [P0, P1, P2, P3, P4]
generation:
  max_tokens: 512
  max_context_tokens: 8192
  temperature: 0.8
training:
  max_steps: 100
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_generations: 4
  learning_rate: 0.000001
  # First establish the no-reference baseline; >0 additionally loads an SFT reference model.
  beta: 0.0
  temperature: 0.8
  top_p: 1.0
  top_k: 0
  max_completion_length: 8192
  num_iterations: 1
  loss_type: grpo
  scale_rewards: group
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  report_to: none
  use_vllm: false
  mask_truncated_completions: false
  remove_unused_columns: false
  ddp_find_unused_parameters: false
  deepspeed: scripts/toolmaze_agent/configs/zero2_offload.json
